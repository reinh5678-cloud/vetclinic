services:
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetclinic
      POSTGRES_USER: vetapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetpass123}
    ports:
      - "5432:5432"
    volumes:
      - vetclinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetapp -d vetclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vetclinic_pgdata:
    driver: local